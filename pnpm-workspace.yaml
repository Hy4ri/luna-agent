# Dependency build scripts are deny-by-default. Only packages listed here may run install scripts.
# esbuild: postinstall validates/links its platform binary (needed by tsx).
# protobufjs: postinstall only patches a CLI version check; not needed at runtime.
# @google/genai: preinstall is a no-op echo.
allowBuilds:
  esbuild: true
  protobufjs: false
  "@google/genai": false
minimumReleaseAgeExclude:
  - "@earendil-works/chord@1.5.0"
  - "@earendil-works/pi-ai@1.5.0"
  - "@earendil-works/pi-codemode@1.5.0"
  - "@earendil-works/pi-durable@1.5.0"
  - "@earendil-works/pi-schema@1.5.0"
  - "@earendil-works/pi-telemetry@1.5.0"
patchedDependencies:
  '@earendil-works/pi-ai@1.5.0': patches/@earendil-works__pi-ai@1.5.0.patch
  '@earendil-works/pi-durable@1.5.0': patches/@earendil-works__pi-durable@1.5.0.patch

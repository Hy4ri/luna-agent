# Dependency build scripts are deny-by-default. Only packages listed here may run install scripts.
# esbuild: postinstall validates/links its platform binary (needed by tsx).
# protobufjs: postinstall only patches a CLI version check; not needed at runtime.
# @google/genai: preinstall is a no-op echo.
allowBuilds:
  esbuild: true
  protobufjs: false
  "@google/genai": false
patchedDependencies:
  '@earendil-works/pi-durable@1.2.0': patches/@earendil-works__pi-durable@1.2.0.patch

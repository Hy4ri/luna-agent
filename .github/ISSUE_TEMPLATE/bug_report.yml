name: Bug Report
description: Report a bug in luna-agent
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, config, or UI actions that trigger the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Bun version (`bun --version`), and commit or release.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: text

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a19">
<link rel="stylesheet" href="/analytics.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Luna</title>
<style>
  :root { color-scheme:dark; --bg:#171a19; --panel:#202422; --raised:#292e2b; --line:#353c37; --fg:#eef1ed; --dim:#a3ada5; --acc:#b5d9ad; --err:#ffa6a0; --ok:#b5d9ad; --radius:14px; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { display:flex; height:100dvh; overflow:hidden; }
  button,input,textarea,select { font:inherit; color:inherit; min-width:0; }
  button,select { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 13px; cursor:pointer; min-height:44px; }
  button { transition:background .15s,border-color .15s; }
  button:hover:not(:disabled) { background:var(--raised); border-color:#667563; }
  button:disabled { opacity:.45; cursor:default; }
  input,textarea { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:10px 12px; outline:none; width:100%; }
  input[type=checkbox],input[type=radio] { width:20px; height:20px; flex:none; accent-color:var(--acc); }
  input:focus,textarea:focus { border-color:var(--acc); }
  :focus-visible { outline:2px solid var(--acc); outline-offset:3px; }
  a { color:var(--acc); text-underline-offset:3px; }
  button svg,.brand svg { width:20px; height:20px; flex:none; vertical-align:middle; }
  .icon-button { width:44px; padding:10px; flex:none; display:inline-flex; align-items:center; justify-content:center; }
  .eyebrow { font-size:11px; font-weight:650; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  #side { width:272px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column; background:#121513; padding:20px 14px 14px; gap:18px; overflow-y:auto; }
  #side header { display:flex; align-items:center; justify-content:space-between; padding:0 8px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand svg { color:var(--acc); width:27px; height:27px; }
  #side h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:-.04em; }
  #side-close { display:none; }
  #new { display:flex; align-items:center; gap:10px; background:var(--acc); border-color:var(--acc); color:#182416; font-weight:600; width:100%; }
  #new:hover { background:#c7e7c0; }
  .history { min-height:140px; flex:1 0 140px; display:flex; flex-direction:column; gap:9px; overflow:hidden; }
  .history .eyebrow { padding:0 10px; }
  #search { min-height:42px; font-size:13px; background:transparent; }
  #sessions { flex:1; overflow:auto; scrollbar-width:thin; }
  #sessions button { display:block; width:100%; text-align:left; border:1px solid transparent; border-radius:8px; background:none; padding:9px 11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim); font-size:14px; margin-bottom:3px; }
  #sessions .session-row { display:flex; align-items:center; gap:2px; }
  #sessions .session-running { font-size:10px; flex:none; }
  #sessions .session-open { flex:1; min-width:0; }
  #sessions .session-manage { width:36px; min-height:44px; padding:7px; flex:none; text-align:center; }
  #sessions .session-manage svg { width:18px; height:18px; }
  #history-view { padding:4px 7px; min-height:32px; font-size:12px; background:transparent; }
  #sessions button.on { background:var(--panel); color:var(--fg); border-color:var(--line); }
  #sessions .muted { padding:10px; }
  #nav { flex:none; display:grid; gap:3px; border-top:1px solid var(--line); padding-top:14px; }
  #nav .eyebrow { padding:0 10px 6px; }
  #nav button { background:none; border-color:transparent; display:flex; align-items:center; gap:12px; text-align:left; padding:7px 10px; font-size:14px; color:var(--dim); }
  #nav button:hover { color:var(--fg); }
  #nav button svg { width:18px; height:18px; }
  #cron-screen { flex:1; min-width:0; min-height:0; overflow:auto; padding:28px max(24px,calc((100% - 1320px)/2)); overflow-wrap:anywhere; }
  #cron-screen > header > .grow { flex:1; }
  #cron-screen > header { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
  #cron-screen h1 { margin:0; font-size:26px; font-weight:600; letter-spacing:-.03em; }
  #cron-screen h2 { margin:0; font-size:19px; }
  #cron-screen h3 { margin:0; font-size:16px; }
  #cron-screen nav, .cron-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  #cron-screen button[aria-selected="true"], #nav button[aria-current="page"] { border-color:var(--acc); color:var(--acc); background:var(--panel); }
  #cron-screen label { display:grid; gap:6px; min-width:0; color:var(--dim); font-size:13px; }
  #cron-screen label input,#cron-screen label textarea,#cron-screen label select { color:var(--fg); font-size:14px; }
  #cron-screen textarea { resize:vertical; min-height:110px; }
  #cron-screen details > summary { cursor:pointer; padding:10px 0; }
  #cron-screen .card { margin-bottom:12px; }
  #cron-screen .md { overflow-wrap:anywhere; }
  #cron-screen .md pre { max-height:none; color:var(--fg); }
  #cron-screen .md p { white-space:pre-wrap; }
  #cron-screen .cron-error { color:var(--err); }
  #cron-screen .cron-unread { border-left:3px solid var(--acc); }
  #cron-screen .cron-content { display:grid; gap:16px; }
  #cron-menu { display:none; }
  @media (max-width:760px) { #cron-screen { padding:16px 14px max(20px,env(safe-area-inset-bottom)); } #cron-menu { display:inline-flex; } #cron-screen label input,#cron-screen label textarea,#cron-screen label select { font-size:16px; } }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  #top { display:flex; align-items:center; gap:12px; padding:16px 28px; border-bottom:1px solid var(--line); min-height:79px; }
  .heading { flex:1; min-width:0; }
  #title { display:block; font-weight:600; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:15px; }
  .heading .muted { font-size:12px; }
  #controls { display:flex; align-items:center; gap:8px; }
  #controls label { display:flex; flex-direction:column; gap:3px; }
  #controls label > span { font-size:10px; color:var(--dim); line-height:1; }
  #model { max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; font-size:12px; }
  #model-picker { inset:85px 12px auto auto; margin:0; width:380px; max-width:calc(100vw - 24px); max-height:calc(100dvh - 110px); overflow:auto; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:var(--radius); padding:12px; }
  #model-picker details { border-top:1px solid var(--line); margin-top:8px; }
  #model-picker summary { cursor:pointer; padding:10px 4px; overflow-wrap:anywhere; }
  .model-row { display:flex; gap:6px; margin:4px 0; }
  .model-choice { flex:1; text-align:left; min-width:0; overflow-wrap:anywhere; }
  .model-choice[aria-current="true"] { border-color:var(--acc); }
  .model-choice small { display:block; color:var(--dim); }
  .model-pin { flex:none; align-self:center; font-size:12px; }
  #controls select { border:0; background:transparent; font-size:12px; padding:4px 24px 4px 0; min-height:28px; }
  #menu { display:none; }
  #stop { color:var(--err); }
  #stop:disabled { display:none; }
  #log { flex:1; min-height:0; overflow:auto; padding:32px max(28px,calc((100% - 800px)/2)); display:flex; flex-direction:column; gap:24px; scrollbar-width:thin; scroll-padding:24px; }
  #welcome { margin:auto; max-width:480px; text-align:center; padding:32px 0; }
  #welcome .welcome-mark { display:inline-flex; padding:16px; border:1px solid var(--line); border-radius:20px; color:var(--acc); margin-bottom:20px; }
  #welcome svg { width:32px; height:32px; }
  #welcome h2 { font-size:clamp(25px,4vw,34px); line-height:1.25; letter-spacing:-.04em; font-weight:500; margin:0 0 12px; }
  #welcome p { color:var(--dim); margin:0; font-size:14px; }
  .msg { width:100%; min-width:0; word-wrap:break-word; overflow-wrap:anywhere; }
  .msg.assistant::before { content:"Luna"; display:block; font-size:11px; font-weight:650; letter-spacing:.06em; color:var(--acc); margin-bottom:10px; }
  .msg.user { align-self:flex-end; width:auto; max-width:88%; background:var(--raised); border:1px solid var(--line); border-radius:18px 18px 4px 18px; padding:12px 18px; white-space:pre-wrap; }
  .msg.err { color:var(--err); white-space:pre-wrap; border-left:2px solid var(--err); padding-left:14px; }
  .msg img.att { max-width:min(300px,100%); max-height:280px; border-radius:10px; display:block; margin:8px 0; }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p { margin:.7em 0; } .md ul,.md ol { margin:.5em 0; padding-left:1.5em; }
  .md h1,.md h2,.md h3,.md h4 { margin:1em 0 .4em; line-height:1.3; letter-spacing:-.02em; }
  .md h1 { font-size:1.5em; } .md h2 { font-size:1.3em; } .md h3,.md h4 { font-size:1.1em; }
  .md blockquote { margin:.7em 0; padding-left:16px; border-left:3px solid var(--line); color:var(--dim); }
  .md code { background:var(--raised); padding:2px 5px; border-radius:5px; font:.88em ui-monospace,monospace; }
  .md table { border-collapse:collapse; margin:.8em 0; display:block; overflow:auto; max-width:100%; }
  .md th,.md td { border:1px solid var(--line); padding:8px 12px; text-align:left; }
  .md th { background:var(--panel); }
  .md hr { border:0; border-top:1px solid var(--line); margin:24px 0; }
  .codewrap { position:relative; min-width:0; }
  .codewrap button { position:absolute; top:6px; right:6px; padding:4px 10px; font-size:11px; min-height:32px; }
  pre.code { background:#111512; border:1px solid var(--line); padding:48px 16px 16px; border-radius:12px; overflow:auto; white-space:pre; font:13px/1.6 ui-monospace,monospace; margin:.8em 0; }
  .tool { width:100%; min-width:0; font:12px/1.6 ui-monospace,monospace; color:var(--dim); border:1px solid var(--line); border-radius:10px; background:var(--panel); }
  .tool summary { cursor:pointer; padding:10px 14px; overflow-wrap:anywhere; }
  .tool pre { margin:0; padding:14px; border-top:1px solid var(--line); overflow:auto; max-height:300px; white-space:pre-wrap; overflow-wrap:anywhere; }
  #compose { padding:12px max(28px,calc((100% - 800px)/2)) max(12px,env(safe-area-inset-bottom)); background:var(--bg); }
  #composer { border:1px solid #505b51; background:var(--panel); border-radius:18px; box-shadow:0 8px 30px #0002; }
  #composer:focus-within { border-color:var(--acc); }
  #atts { display:flex; gap:10px; padding:12px 14px 0; flex-wrap:wrap; }
  #atts:empty { display:none; }
  #atts div { position:relative; } #atts img { height:60px; border-radius:8px; display:block; }
  #atts button { position:absolute; top:-6px; right:-6px; padding:0; width:28px; min-height:28px; border-radius:50%; font-size:16px; }
  #form { display:flex; flex-wrap:wrap; gap:8px; padding:12px; align-items:flex-end; }
  #input { width:100%; flex:1 0 100%; min-height:48px; resize:none; overflow-y:auto; scrollbar-width:thin; max-height:25dvh; border:0; background:transparent; border-radius:0; padding:4px 4px 12px; outline:none; }
  #input:focus-visible { outline:none; }
  #attach { background:transparent; border-color:transparent; color:var(--dim); }
  .compose-hint { flex:1; align-self:center; color:var(--dim); font-size:11px; }
  #send { background:var(--acc); color:#182416; border-color:var(--acc); display:flex; align-items:center; gap:9px; font-weight:600; }
  #send:hover:not(:disabled) { background:#c7e7c0; }
  #file { display:none; }
  #statusbar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 12px; padding:8px 5px 0; min-height:27px; }
  #context-bar { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:11px; }
  #context-meter { width:60px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; flex:none; }
  #context-fill { height:100%; width:0; background:var(--ok); transition:width .2s; }
  #context-bar[data-level="amber"] #context-fill { background:#e4c17b; }
  #context-bar[data-level="red"] #context-fill { background:var(--err); }
  #usage,.status { color:var(--dim); font-size:11px; }
  #status { display:flex; align-items:center; gap:7px; }
  #status:not(:empty)::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--acc); flex:none; }
  #jump { position:absolute; right:24px; bottom:225px; border-radius:50%; background:var(--raised); box-shadow:0 3px 12px #0005; }
  #login { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--bg); z-index:20; padding:24px; }
  #login form { display:flex; flex-direction:column; gap:18px; width:min(380px,100%); padding:28px; background:var(--panel); border:1px solid var(--line); border-radius:20px; }
  #login h2 { font-size:24px; margin:0; letter-spacing:-.03em; }
  #login p { margin:0; color:var(--dim); font-size:13px; }
  #login button { background:var(--acc); color:#182416; font-weight:600; }
  #panel { position:fixed; inset:0; z-index:10; display:none; background:#0008; backdrop-filter:blur(3px); }
  #panel.open { display:flex; justify-content:flex-end; }
  #panel > div { width:min(620px,100%); height:100%; background:var(--bg); border-left:1px solid var(--line); display:flex; flex-direction:column; box-shadow:-20px 0 80px #0003; }
  #panel header { display:flex; align-items:center; gap:14px; padding:22px 24px; border-bottom:1px solid var(--line); }
  #panel header .heading { flex:1; }
  #ptitle { font-size:21px; font-weight:550; letter-spacing:-.025em; }
  #pdesc { color:var(--dim); font-size:12px; margin:4px 0 0; }
  #pbody { flex:1; min-height:0; overflow:auto; padding:24px 24px max(24px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:18px; overflow-wrap:anywhere; }
  #pbody > * { flex-shrink:0; }
  #pbody input,#pbody textarea,#pbody select { font-size:14px; }
  #pbody select { width:100%; max-width:100%; }
  #pbody .field-label { display:grid; gap:6px; min-width:0; flex:1; color:var(--dim); font-size:12px; }
  .card { border:1px solid var(--line); border-radius:var(--radius); padding:18px; background:var(--panel); min-width:0; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row .grow { flex:1; min-width:100px; overflow-wrap:anywhere; }
  .row > input:not([type=checkbox]):not([type=radio]),.row > select { flex:1; width:0; min-width:120px; }
  .card pre { white-space:pre-wrap; margin:10px 0 0; font:12px/1.6 ui-monospace,monospace; color:var(--dim); max-height:280px; overflow:auto; overflow-wrap:anywhere; }
  .muted { color:var(--dim); font-size:12px; }
  .pill { font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); } .pill.error { color:var(--err); } .pill.running { color:var(--acc); }
  .grid { display:grid; gap:12px; min-width:0; }
  #panel.wide > div { width:min(1180px,100%); }
  .kanban { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(200px,1fr); gap:12px; overflow-x:auto; align-items:start; padding-bottom:6px; }
  .kanban .col { display:grid; gap:8px; min-width:0; align-content:start; }
  .kanban .col > .eyebrow { display:flex; justify-content:space-between; }
  .kcard { border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--panel); display:grid; gap:8px; min-width:0; }
  .kcard.urgent { border-left:3px solid var(--err); } .kcard.high { border-left:3px solid var(--acc); }
  .kcard .subject { text-align:left; background:none; border:0; padding:0; min-height:0; font-weight:550; }
  .kcard select { min-height:36px; padding:4px 8px; }
  #extras { padding:0 max(28px,calc((100% - 800px)/2)); display:flex; flex-direction:column; gap:8px; max-height:35dvh; overflow:auto; }
  #extras:empty { display:none; }
  #extras .opt { display:flex; gap:12px; align-items:flex-start; padding:10px; border:1px solid var(--line); border-radius:9px; cursor:pointer; }
  #extras .opt:has(input:checked) { border-color:var(--acc); background:#b5d9ad0a; }
  #extras .opt input { margin-top:4px; }
  #extras .todo { font-size:13px; }
  #extras .todo .done { color:var(--dim); text-decoration:line-through; }
  #shade { display:none; }
  @media (min-width:1600px) { #side { width:300px; } }
  @media (max-width:1000px) { #side { width:240px; } #top { padding:16px 20px; } #model { max-width:180px; } }
  @media (max-width:760px) {
    #side { position:fixed; inset:0 auto 0 0; width:min(320px,88vw); z-index:6; transform:translateX(-100%); transition:transform .18s ease; padding-top:max(20px,env(safe-area-inset-top)); }
    #side.open { transform:none; box-shadow:20px 0 80px #0008; }
    #shade.open { display:block; position:fixed; inset:0; background:#0009; z-index:5; border:0; border-radius:0; }
    #menu,#side-close { display:inline-flex; }
    #top { flex-wrap:wrap; gap:6px 10px; padding:10px 14px; padding-top:max(10px,env(safe-area-inset-top)); }
    .heading .muted { display:none; }
    #controls { order:3; width:100%; border-top:1px solid var(--line); margin-top:4px; padding-top:9px; gap:16px; }
    #controls label { min-width:0; } #controls label:first-child { flex:1; }
    #model { max-width:100%; width:100%; }
    #controls select { font-size:12px; min-height:44px; }
    .codewrap button { min-height:44px; }
    #log { padding:24px 18px; gap:22px; }
    #compose { padding:8px 12px max(8px,env(safe-area-inset-bottom)); }
    #form { padding:10px; }
    #input { font-size:16px; max-height:24dvh; }
    .compose-hint { visibility:hidden; }
    #statusbar { flex-wrap:wrap; gap:2px 10px; }
    #usage { font-size:10px; }
    #extras { padding:0 12px; }
    #panel header { padding:16px; padding-top:max(16px,env(safe-area-inset-top)); }
    #pbody { padding:18px 16px max(18px,env(safe-area-inset-bottom)); }
    #pbody input,#pbody textarea,#pbody select { font-size:16px; }
    .card { padding:14px; }
    #jump { right:18px; bottom:210px; }
    .msg.user { max-width:94%; padding:11px 15px; }
  }
  @media (max-height:500px) { #top { padding-top:6px; padding-bottom:6px; } #controls { padding-top:3px; } #compose { padding-top:4px; } #input { min-height:32px; } #statusbar { display:none; } #welcome { padding:10px 0; } #welcome .welcome-mark { display:none; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<aside id="side" aria-label="Workspace">
  <header><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A9 9 0 0 1 11 3.5 9 9 0 1 0 20.5 13Z"/></svg><h1>Luna</h1></div><button id="side-close" class="icon-button" aria-label="Close navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
  <select id="project" aria-label="Project for new conversations"><option value="">No project</option></select>
  <button id="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New conversation</button>
  <section class="history" aria-label="Conversation history">
    <div class="row"><div class="eyebrow grow">Conversations</div><select id="history-view" aria-label="Conversation view"><option value="active">Active</option><option value="archived">Archived</option></select></div>
    <input id="search" type="search" placeholder="Find a conversation" aria-label="Find a conversation" autocomplete="off">
    <div id="sessions"></div>
  </section>
  <nav id="nav" aria-label="Workspace tools">
    <div class="eyebrow">Workspace</div>
    <button data-panel="agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M14 6h4v8M6 10v8h8"/></svg>Subagents</button>

// ---- markdown: builds DOM nodes only (never innerHTML), links limited to http(s)/mailto ----
function inline(text) {
  const out = [];
  const re = /(`+)([\s\S]*?)\1|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*\s][^*]*)\*|_([^_\s][^_]*)_|~~([^~]+)~~|\[([^\]]+)\]\(([^)\s]+)\)|(https?:\/\/[^\s<)]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    if (m[1]) out.push(h("code", {}, m[2]));
    else if (m[3] || m[4]) out.push(h("strong", {}, ...inline(m[3] || m[4])));
    else if (m[5] || m[6]) out.push(h("em", {}, ...inline(m[5] || m[6])));
    else if (m[7]) out.push(h("del", {}, ...inline(m[7])));
    else if (m[8]) out.push(safeLink(m[9], inline(m[8])));
    else if (m[10]) out.push(safeLink(m[10], [m[10]]));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}
function safeLink(href, kids) {
  if (!/^(https?:|mailto:)/i.test(href)) return h("span", {}, ...kids);
  return h("a", { href, target: "_blank", rel: "noopener noreferrer" }, ...kids);
}
function codeBlock(code) {
  const pre = h("pre", { class: "code" }, code);
  const btn = h("button", { type: "button", onclick: () => { navigator.clipboard?.writeText(code); btn.textContent = "copied"; setTimeout(() => (btn.textContent = "copy"), 1200); } }, "copy");
  return h("div", { class: "codewrap" }, pre, btn);
}
function markdown(src) {
  const frag = document.createDocumentFragment();
  const lines = String(src).replace(/\r\n/g, "\n").split("\n");
  let i = 0, para = [];
  const flush = () => { if (para.length) { frag.append(h("p", {}, ...inline(para.join("\n")))); para = []; } };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = /^\s*(```|~~~)/.exec(l))) {
      flush();
      const fence = m[1], body = [];
      i++;
      while (i < lines.length && !lines[i].trimStart().startsWith(fence)) body.push(lines[i++]);
      i++; frag.append(codeBlock(body.join("\n"))); continue;
    }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { flush(); frag.append(h("h" + Math.min(m[1].length, 4), {}, ...inline(m[2]))); i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)) { flush(); frag.append(h("hr")); i++; continue; }
    if (/^\s*>/.test(l)) {
      flush(); const q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
      const bq = h("blockquote"); bq.append(markdown(q.join("\n"))); frag.append(bq); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      flush();
      const ordered = /^\s*\d/.test(l), list = h(ordered ? "ol" : "ul");
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        const item = [lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "")];
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item.push(lines[i++].trim());
        const li = h("li"); li.append(...inline(item.join("\n"))); list.append(li);
      }
      frag.append(list); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      flush();
      const cells = (s) => s.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const table = h("table"), head = h("tr");
      for (const c of cells(l)) head.append(h("th", {}, ...inline(c)));
      table.append(head); i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { const tr = h("tr"); for (const c of cells(lines[i++])) tr.append(h("td", {}, ...inline(c))); table.append(tr); }
      frag.append(table); continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l); i++;
  }
  flush();
  return frag;
}

// ---- usage ----
function showUsage(u) {
  if (!u?.models) { $("usage").textContent = ""; return; }
  let inT = 0, outT = 0, cost = 0;
  for (const v of Object.values(u.models)) { inT += v.input + (v.cacheRead || 0) + (v.cacheWrite || 0); outT += v.output; cost += v.cost?.total || 0; }
  $("usage").textContent = `${(inT / 1000).toFixed(1)}k in · ${(outT / 1000).toFixed(1)}k out${cost ? " · $" + cost.toFixed(4) : ""}`;
}

// Context is a request-size estimate, not the cumulative usage shown beside it.
let contextTimer, contextRevision = 0, contextCompacting = false;
let activeCompactions = new Set();
function showContextUsage(value) {

  bar.hidden = !value;
  if (!value) return;
  contextCompacting = !!value.compacting;
  const known = Number.isFinite(value.contextWindow) && value.contextWindow > 0 && Number.isFinite(value.percent);
  const percent = known ? value.percent : null;
  bar.dataset.level = known ? percent >= value.triggerPercent ? "red" : percent >= 50 ? "amber" : "green" : "unknown";
  $("context-fill").style.width = known ? Math.max(0, Math.min(100, percent)) + "%" : "0%";
  meter.hidden = !known;
  if (known) {
    meter.setAttribute("aria-valuenow", String(Math.max(0, Math.min(100, percent))));
    meter.setAttribute("aria-valuetext", percent.toFixed(1) + "% of model context, estimated");
  } else { meter.removeAttribute("aria-valuenow"); meter.removeAttribute("aria-valuetext"); }

  bar.title = `Estimated active context. Automatic compaction ${value.autoCompactionEnabled ? "at " + value.triggerPercent + "%" : "disabled"}.`;
  updateRunControls();
}
function scheduleContext() {
  clearTimeout(contextTimer);
  const sid = session, epoch = viewEpoch, revision = ++contextRevision;
  if (!sid) return;
  contextTimer = setTimeout(async () => {
    try {
      const value = await json(`/v1/sessions/${sid}/context`);
      if (sid === session && epoch === viewEpoch && revision === contextRevision) showContextUsage(value);
    } catch {
      if (sid === session && epoch === viewEpoch && revision === contextRevision) {
        $("context-bar").hidden = false; $("context-meter").hidden = true;
        $("context-text").textContent = "Context usage unavailable";

// ---- models / thinking ----
const LEVELS = ["off", "minimal", "low", "medium", "high", "xhigh", "max"];
let selectedModel = null;
const PIN_KEY = "luna.pinnedModels";
function readModelPins() {
  try {
    const pins = JSON.parse(localStorage.getItem(PIN_KEY) || "[]");
    return new Set(Array.isArray(pins) ? pins.filter(p => typeof p === "string") : []);
  } catch { return new Set(); }
}
const modelKey = m => m.provider + "/" + m.id;
function updateModelLabel() {
  const key = selectedModel && selectedModel.provider + "/" + selectedModel.modelId;
  const m = modelList.find(m => modelKey(m) === key);
  $("model").textContent = m ? m.provider + " · " + (m.name || m.id) : key || "Choose model";
  $("model").title = $("model").textContent;
}
function renderModelPicker(openProviders = new Set()) {
  const box = $("model-picker"), pins = readModelPins();
  box.replaceChildren();
  function row(m, available = true) {
    const key = modelKey(m), pinned = pins.has(key);
    const choice = h("button", { type: "button", class: "model-choice", "data-model": key,
      "aria-current": String(selectedModel?.provider === m.provider && selectedModel?.modelId === m.id),
      onclick: async () => {
        choice.disabled = true;
        try {
          const target = session || String(await newSession() || "");
          if (!target) return;
          await post(`/v1/sessions/${target}`, { model: { provider: m.provider, modelId: m.id } }, "PATCH");
          if (session === target) { selectedModel = { provider: m.provider, modelId: m.id }; updateModelLabel(); box.hidePopover(); $("model").focus(); }
        } catch (e) { addErr(e.message); }
        finally { choice.disabled = !available; }
      } }, m.name || m.id, h("small", {}, m.provider + (available ? "" : " · Unavailable")));
    choice.disabled = !available;
    return h("div", { class: "model-row" }, choice, h("button", { type: "button", class: "model-pin",
      "aria-label": (pinned ? "Unpin " : "Pin ") + key, "aria-pressed": String(pinned), onclick: () => {
        const next = readModelPins(); if (next.has(key)) next.delete(key); else next.add(key);
        try { localStorage.setItem(PIN_KEY, JSON.stringify([...next])); }
        catch { addErr("Could not save pinned models in this browser."); return; }
        const open = new Set([...box.querySelectorAll("details[open]")].map(d => d.dataset.provider));
        renderModelPicker(open);
        [...box.querySelectorAll(".model-pin")].find(b => b.getAttribute("aria-label") === (next.has(key) ? "Unpin " : "Pin ") + key)?.focus();
      } }, pinned ? "Unpin" : "Pin"));
  }
  if (pins.size) {
    const section = h("section", { "aria-label": "Pinned models", "data-pinned-models": "" }, h("b", {}, "Pinned"));
    for (const key of pins) {
      const m = modelList.find(m => modelKey(m) === key);
      const [provider, ...id] = key.split("/");
      section.append(row(m || { provider, id: id.join("/") }, !!m));
    }
    box.append(section);
  }
  const providers = new Map();
  for (const m of modelList) {
    if (!providers.has(m.provider)) providers.set(m.provider, []);
    providers.get(m.provider).push(m);
  }
  for (const [provider, models] of providers) {
    const group = h("details", { "data-provider": provider }, h("summary", {}, provider + " (" + models.length + ")"), ...models.map(m => row(m)));

function loginBox(body, login) {
  // Drives one interactive login: shows auth URLs / device codes / progress and answers prompts.
  const box = h("div", { class: "card grid" });
  body.prepend(box);
  let seen = -1, stop = false;
  const render = (l) => {
    box.replaceChildren(h("div", { class: "row" }, h("b", { class: "grow" }, "Login: " + l.providerId), h("span", { class: "pill " + (l.status === "done" ? "ok" : l.status === "running" ? "" : "error") }, l.status),
      l.status === "running" ? h("button", { onclick: async () => { stop = true; await api(`/v1/logins/${l.id}`, { method: "DELETE" }); refresh(); } }, "Cancel") : null));
    for (const e of l.events) {
      if (e.type === "auth_url") box.append(h("div", {}, h("a", { href: e.url, target: "_blank", rel: "noopener noreferrer" }, "Open sign-in page ↗"), e.instructions ? h("div", { class: "muted" }, e.instructions) : null));
      else if (e.type === "device_code") box.append(h("div", {}, "Code ", h("b", {}, e.userCode), " at ", h("a", { href: e.verificationUri, target: "_blank", rel: "noopener noreferrer" }, e.verificationUri)));
      else box.append(h("div", { class: "muted" }, e.message));
    }
    if (l.error) box.append(h("pre", {}, l.error));
    const p = l.prompt;
    if (p) {
      const send = async (v) => { try { await post(`/v1/logins/${l.id}/answer`, { seq: p.seq, value: v }); } catch (e) { toast(body, e.message); } };
      box.append(h("div", { class: "muted" }, p.message));
      if (p.type === "select") box.append(h("div", { class: "row" }, ...p.options.map((o) => h("button", { title: o.description || "", onclick: () => send(o.id) }, o.label))));
      else {
        const inp = h("input", { type: p.type === "secret" ? "password" : "text", placeholder: p.placeholder || "" });
        box.append(inp, h("div", { class: "row" }, h("button", { onclick: () => send(inp.value) }, "Submit")));
        if (p.type === "manual_code") box.append(h("div", { class: "muted" }, "On another device the browser cannot reach the callback. After you sign in, copy the final URL from the address bar (or the code shown) and paste it here."));
      }
    }
  };
  const tick = async () => {
    if (stop || currentPanel !== "providers") return;
    const l = await json(`/v1/logins/${login.id}`).catch(() => null);
    if (!l) return;
    const sig = JSON.stringify([l.status, l.events.length, l.prompt?.seq, l.error]);
    if (sig !== seen) { seen = sig; render(l); }
    if (l.status === "running") setTimeout(tick, 1000);
    else { await loadModels(); if (l.status === "done") setTimeout(refresh, 800); }
  };
  render(login); tick();
}
const DESCRIPTIONS = {

async function openPanel(name) {

async function refresh() {

  const name = currentPanel;
  const content = h("div", { class: "grid" });
  body.append(h("p", { class: "muted", role: "status" }, "Loading…"));
  try {
    await panels[name](content);
    if (currentPanel !== name) return;
    for (const field of content.querySelectorAll("input[placeholder],textarea[placeholder],select")) {
      if (field.closest("label") || field.closest(".kanban") || field.type === "hidden") continue;
      const text = field.getAttribute("aria-label") || field.placeholder || ({ http: "Transport", "openai-completions": "API format" }[field.value]) || "Model";

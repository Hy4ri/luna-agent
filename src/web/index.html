<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a19">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Luna</title>
<style>
  :root { color-scheme:dark; --bg:#171a19; --panel:#202422; --raised:#292e2b; --line:#353c37; --fg:#eef1ed; --dim:#a3ada5; --acc:#b5d9ad; --err:#ffa6a0; --ok:#b5d9ad; --radius:14px; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { display:flex; height:100dvh; overflow:hidden; }
  button,input,textarea,select { font:inherit; color:inherit; min-width:0; }
  button,select { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 13px; cursor:pointer; min-height:44px; }
  button { transition:background .15s,border-color .15s; }
  button:hover:not(:disabled) { background:var(--raised); border-color:#667563; }
  button:disabled { opacity:.45; cursor:default; }
  input,textarea { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:10px 12px; outline:none; width:100%; }
  input[type=checkbox],input[type=radio] { width:20px; height:20px; flex:none; accent-color:var(--acc); }
  input:focus,textarea:focus { border-color:var(--acc); }
  :focus-visible { outline:2px solid var(--acc); outline-offset:3px; }
  a { color:var(--acc); text-underline-offset:3px; }
  button svg,.brand svg { width:20px; height:20px; flex:none; vertical-align:middle; }
  .icon-button { width:44px; padding:10px; flex:none; display:inline-flex; align-items:center; justify-content:center; }
  .eyebrow { font-size:11px; font-weight:650; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  #side { width:272px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column; background:#121513; padding:20px 14px 14px; gap:18px; overflow-y:auto; }
  #side header { display:flex; align-items:center; justify-content:space-between; padding:0 8px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand svg { color:var(--acc); width:27px; height:27px; }
  #side h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:-.04em; }
  #side-close { display:none; }
  #new { display:flex; align-items:center; gap:10px; background:var(--acc); border-color:var(--acc); color:#182416; font-weight:600; width:100%; }
  #new:hover { background:#c7e7c0; }
  .history { min-height:140px; flex:1 0 140px; display:flex; flex-direction:column; gap:9px; overflow:hidden; }
  .history .eyebrow { padding:0 10px; }
  #search { min-height:42px; font-size:13px; background:transparent; }
  #sessions { flex:1; overflow:auto; scrollbar-width:thin; }
  #sessions button { display:block; width:100%; text-align:left; border:1px solid transparent; border-radius:8px; background:none; padding:9px 11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim); font-size:14px; margin-bottom:3px; }
  #sessions button.on { background:var(--panel); color:var(--fg); border-color:var(--line); }
  #sessions .muted { padding:10px; }
  #nav { flex:none; display:grid; gap:3px; border-top:1px solid var(--line); padding-top:14px; }
  #nav .eyebrow { padding:0 10px 6px; }
  #nav button { background:none; border-color:transparent; display:flex; align-items:center; gap:12px; text-align:left; padding:7px 10px; font-size:14px; color:var(--dim); }
  #nav button:hover { color:var(--fg); }
  #nav button svg { width:18px; height:18px; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  #top { display:flex; align-items:center; gap:12px; padding:16px 28px; border-bottom:1px solid var(--line); min-height:79px; }
  .heading { flex:1; min-width:0; }
  #title { display:block; font-weight:600; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:15px; }
  .heading .muted { font-size:12px; }
  #controls { display:flex; align-items:center; gap:8px; }
  #controls label { display:flex; flex-direction:column; gap:3px; }
  #controls label > span { font-size:10px; color:var(--dim); line-height:1; }
  #model { max-width:240px; }
  #controls select { border:0; background:transparent; font-size:12px; padding:4px 24px 4px 0; min-height:28px; }
  #menu { display:none; }
  #stop { color:var(--err); }
  #stop:disabled { display:none; }
  #log { flex:1; min-height:0; overflow:auto; padding:32px max(28px,calc((100% - 800px)/2)); display:flex; flex-direction:column; gap:24px; scrollbar-width:thin; scroll-padding:24px; }
  #welcome { margin:auto; max-width:480px; text-align:center; padding:32px 0; }
  #welcome .welcome-mark { display:inline-flex; padding:16px; border:1px solid var(--line); border-radius:20px; color:var(--acc); margin-bottom:20px; }
  #welcome svg { width:32px; height:32px; }
  #welcome h2 { font-size:clamp(25px,4vw,34px); line-height:1.25; letter-spacing:-.04em; font-weight:500; margin:0 0 12px; }
  #welcome p { color:var(--dim); margin:0; font-size:14px; }
  .msg { width:100%; min-width:0; word-wrap:break-word; overflow-wrap:anywhere; }
  .msg.assistant::before { content:"Luna"; display:block; font-size:11px; font-weight:650; letter-spacing:.06em; color:var(--acc); margin-bottom:10px; }
  .msg.user { align-self:flex-end; width:auto; max-width:88%; background:var(--raised); border:1px solid var(--line); border-radius:18px 18px 4px 18px; padding:12px 18px; white-space:pre-wrap; }
  .msg.err { color:var(--err); white-space:pre-wrap; border-left:2px solid var(--err); padding-left:14px; }
  .msg img.att { max-width:min(300px,100%); max-height:280px; border-radius:10px; display:block; margin:8px 0; }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p { margin:.7em 0; } .md ul,.md ol { margin:.5em 0; padding-left:1.5em; }
  .md h1,.md h2,.md h3,.md h4 { margin:1em 0 .4em; line-height:1.3; letter-spacing:-.02em; }
  .md h1 { font-size:1.5em; } .md h2 { font-size:1.3em; } .md h3,.md h4 { font-size:1.1em; }
  .md blockquote { margin:.7em 0; padding-left:16px; border-left:3px solid var(--line); color:var(--dim); }
  .md code { background:var(--raised); padding:2px 5px; border-radius:5px; font:.88em ui-monospace,monospace; }
  .md table { border-collapse:collapse; margin:.8em 0; display:block; overflow:auto; max-width:100%; }
  .md th,.md td { border:1px solid var(--line); padding:8px 12px; text-align:left; }
  .md th { background:var(--panel); }
  .md hr { border:0; border-top:1px solid var(--line); margin:24px 0; }
  .codewrap { position:relative; min-width:0; }
  .codewrap button { position:absolute; top:6px; right:6px; padding:4px 10px; font-size:11px; min-height:32px; }
  pre.code { background:#111512; border:1px solid var(--line); padding:48px 16px 16px; border-radius:12px; overflow:auto; white-space:pre; font:13px/1.6 ui-monospace,monospace; margin:.8em 0; }
  .tool { width:100%; min-width:0; font:12px/1.6 ui-monospace,monospace; color:var(--dim); border:1px solid var(--line); border-radius:10px; background:var(--panel); }
  .tool summary { cursor:pointer; padding:10px 14px; overflow-wrap:anywhere; }
  .tool pre { margin:0; padding:14px; border-top:1px solid var(--line); overflow:auto; max-height:300px; white-space:pre-wrap; overflow-wrap:anywhere; }
  #compose { padding:12px max(28px,calc((100% - 800px)/2)) max(12px,env(safe-area-inset-bottom)); background:var(--bg); }
  #composer { border:1px solid #505b51; background:var(--panel); border-radius:18px; box-shadow:0 8px 30px #0002; }
  #composer:focus-within { border-color:var(--acc); }
  #atts { display:flex; gap:10px; padding:12px 14px 0; flex-wrap:wrap; }
  #atts:empty { display:none; }
  #atts div { position:relative; } #atts img { height:60px; border-radius:8px; display:block; }
  #atts button { position:absolute; top:-6px; right:-6px; padding:0; width:28px; min-height:28px; border-radius:50%; font-size:16px; }
  #form { display:flex; flex-wrap:wrap; gap:8px; padding:12px; align-items:flex-end; }
  #input { width:100%; flex:1 0 100%; min-height:48px; resize:none; overflow-y:auto; scrollbar-width:thin; max-height:25dvh; border:0; background:transparent; border-radius:0; padding:4px 4px 12px; outline:none; }
  #input:focus-visible { outline:none; }
  #attach { background:transparent; border-color:transparent; color:var(--dim); }
  .compose-hint { flex:1; align-self:center; color:var(--dim); font-size:11px; }
  #send { background:var(--acc); color:#182416; border-color:var(--acc); display:flex; align-items:center; gap:9px; font-weight:600; }
  #send:hover:not(:disabled) { background:#c7e7c0; }
  #file { display:none; }
  #statusbar { display:flex; justify-content:space-between; gap:12px; padding:8px 5px 0; min-height:27px; }
  #usage,.status { color:var(--dim); font-size:11px; }
  #status { display:flex; align-items:center; gap:7px; }
  #status:not(:empty)::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--acc); flex:none; }
  #jump { position:absolute; right:24px; bottom:225px; border-radius:50%; background:var(--raised); box-shadow:0 3px 12px #0005; }
  #login { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--bg); z-index:20; padding:24px; }
  #login form { display:flex; flex-direction:column; gap:18px; width:min(380px,100%); padding:28px; background:var(--panel); border:1px solid var(--line); border-radius:20px; }
  #login h2 { font-size:24px; margin:0; letter-spacing:-.03em; }
  #login p { margin:0; color:var(--dim); font-size:13px; }
  #login button { background:var(--acc); color:#182416; font-weight:600; }
  #panel { position:fixed; inset:0; z-index:10; display:none; background:#0008; backdrop-filter:blur(3px); }
  #panel.open { display:flex; justify-content:flex-end; }
  #panel > div { width:min(620px,100%); height:100%; background:var(--bg); border-left:1px solid var(--line); display:flex; flex-direction:column; box-shadow:-20px 0 80px #0003; }
  #panel header { display:flex; align-items:center; gap:14px; padding:22px 24px; border-bottom:1px solid var(--line); }
  #panel header .heading { flex:1; }
  #ptitle { font-size:21px; font-weight:550; letter-spacing:-.025em; }
  #pdesc { color:var(--dim); font-size:12px; margin:4px 0 0; }
  #pbody { flex:1; min-height:0; overflow:auto; padding:24px 24px max(24px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:18px; overflow-wrap:anywhere; }
  #pbody > * { flex-shrink:0; }
  #pbody input,#pbody textarea,#pbody select { font-size:14px; }
  #pbody select { width:100%; max-width:100%; }
  #pbody .field-label { display:grid; gap:6px; min-width:0; flex:1; color:var(--dim); font-size:12px; }
  .card { border:1px solid var(--line); border-radius:var(--radius); padding:18px; background:var(--panel); min-width:0; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row .grow { flex:1; min-width:100px; overflow-wrap:anywhere; }
  .row > input:not([type=checkbox]):not([type=radio]),.row > select { flex:1; width:0; min-width:120px; }
  .card pre { white-space:pre-wrap; margin:10px 0 0; font:12px/1.6 ui-monospace,monospace; color:var(--dim); max-height:280px; overflow:auto; overflow-wrap:anywhere; }
  .muted { color:var(--dim); font-size:12px; }
  .pill { font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); } .pill.error { color:var(--err); } .pill.running { color:var(--acc); }
  .grid { display:grid; gap:12px; min-width:0; }
  #extras { padding:0 max(28px,calc((100% - 800px)/2)); display:flex; flex-direction:column; gap:8px; max-height:35dvh; overflow:auto; }
  #extras:empty { display:none; }
  #extras .opt { display:flex; gap:12px; align-items:flex-start; padding:10px; border:1px solid var(--line); border-radius:9px; cursor:pointer; }
  #extras .opt:has(input:checked) { border-color:var(--acc); background:#b5d9ad0a; }
  #extras .opt input { margin-top:4px; }
  #extras .todo { font-size:13px; }
  #extras .todo .done { color:var(--dim); text-decoration:line-through; }
  #shade { display:none; }
  @media (min-width:1600px) { #side { width:300px; } }
  @media (max-width:1000px) { #side { width:240px; } #top { padding:16px 20px; } #model { max-width:180px; } }
  @media (max-width:760px) {
    #side { position:fixed; inset:0 auto 0 0; width:min(320px,88vw); z-index:6; transform:translateX(-100%); transition:transform .18s ease; padding-top:max(20px,env(safe-area-inset-top)); }
    #side.open { transform:none; box-shadow:20px 0 80px #0008; }
    #shade.open { display:block; position:fixed; inset:0; background:#0009; z-index:5; border:0; border-radius:0; }
    #menu,#side-close { display:inline-flex; }
    #top { flex-wrap:wrap; gap:6px 10px; padding:10px 14px; padding-top:max(10px,env(safe-area-inset-top)); }
    .heading .muted { display:none; }
    #controls { order:3; width:100%; border-top:1px solid var(--line); margin-top:4px; padding-top:9px; gap:16px; }
    #controls label { min-width:0; } #controls label:first-child { flex:1; }
    #model { max-width:100%; width:100%; }
    #controls select { font-size:12px; min-height:44px; }
    .codewrap button { min-height:44px; }
    #log { padding:24px 18px; gap:22px; }
    #compose { padding:8px 12px max(8px,env(safe-area-inset-bottom)); }
    #form { padding:10px; }
    #input { font-size:16px; max-height:24dvh; }
    .compose-hint { visibility:hidden; }
    #statusbar { flex-wrap:wrap; gap:2px 10px; }
    #usage { font-size:10px; }
    #extras { padding:0 12px; }
    #panel header { padding:16px; padding-top:max(16px,env(safe-area-inset-top)); }
    #pbody { padding:18px 16px max(18px,env(safe-area-inset-bottom)); }
    #pbody input,#pbody textarea,#pbody select { font-size:16px; }
    .card { padding:14px; }
    #jump { right:18px; bottom:210px; }
    .msg.user { max-width:94%; padding:11px 15px; }
  }
  @media (max-height:500px) { #top { padding-top:6px; padding-bottom:6px; } #controls { padding-top:3px; } #compose { padding-top:4px; } #input { min-height:32px; } #statusbar { display:none; } #welcome { padding:10px 0; } #welcome .welcome-mark { display:none; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<aside id="side" aria-label="Workspace">
  <header><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A9 9 0 0 1 11 3.5 9 9 0 1 0 20.5 13Z"/></svg><h1>Luna</h1></div><button id="side-close" class="icon-button" aria-label="Close navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
  <button id="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New conversation</button>
  <section class="history" aria-label="Conversation history">
    <div class="eyebrow">Conversations</div>
    <input id="search" type="search" placeholder="Find a conversation" aria-label="Find a conversation" autocomplete="off">
    <div id="sessions"></div>
  </section>
  <nav id="nav" aria-label="Workspace tools">
    <div class="eyebrow">Workspace</div>
    <button data-panel="agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M14 6h4v8M6 10v8h8"/></svg>Subagents</button>
    <button data-panel="cron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Scheduled jobs</button>
    <button data-panel="memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5c3-2 5-2 8 0 3-2 5-2 8 0v15c-3-2-5-2-8 0-3-2-5-2-8 0ZM12 5v15"/></svg>Memory</button>
    <button data-panel="skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>Skills</button>
    <button data-panel="providers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>Model providers</button>
    <button data-panel="mcp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v5M16 3v5M6 8h12v3a6 6 0 0 1-12 0ZM12 17v4"/></svg>MCP servers</button>
    <button data-panel="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg>Settings</button>
  </nav>
</aside>
<button id="shade" aria-label="Close navigation" tabindex="-1"></button>
<main id="main">
  <header id="top">
    <button id="menu" class="icon-button" aria-label="Open navigation" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="heading"><span id="title">New conversation</span><span class="muted">Luna workspace</span></div>
    <div id="controls">
      <label><span>Model</span><select id="model" aria-label="Model"></select></label>
      <label><span>Thinking</span><select id="think" aria-label="Thinking level"></select></label>
    </div>
    <button id="stop" disabled>Stop response</button>
    <button id="more" class="icon-button" title="Conversation settings" aria-label="Conversation settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </header>
  <div id="log" role="region" aria-label="Conversation" tabindex="0"></div>
  <button id="jump" class="icon-button" aria-label="Scroll to latest message" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg></button>
  <div id="extras" aria-label="Tasks and questions"></div>
  <div id="compose">
    <div id="composer">
      <div id="atts" aria-label="Attached images"></div>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Message Luna…" aria-label="Message Luna"></textarea>
        <button type="button" id="attach" class="icon-button" title="Attach images" aria-label="Attach images"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 13 7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L12 3"/></svg></button>
        <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
        <span class="compose-hint">Enter to send · Shift + Enter for a new line</span>
        <button id="send" type="submit">Send <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </form>
    </div>
    <div id="statusbar"><span class="status" id="status" role="status"></span><span id="usage" aria-label="Token usage"></span></div>
  </div>
</main>
<div id="panel"><div role="dialog" aria-modal="true" aria-labelledby="ptitle" aria-describedby="pdesc" tabindex="-1"><header><div class="heading"><b id="ptitle"></b><p id="pdesc"></p></div><button id="pclose" class="icon-button" aria-label="Close panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header><div id="pbody"></div></div></div>
<div id="login" role="dialog" aria-modal="true" aria-labelledby="loginTitle"><form id="loginForm"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A9 9 0 0 1 11 3.5 9 9 0 1 0 20.5 13Z"/></svg><h2 id="loginTitle">Connect to Luna</h2></div><p>Enter your server token to open your workspace.</p><label class="grid">Server token<input id="token" type="password" autocomplete="current-password" placeholder="LUNA_TOKEN" required></label><button>Connect</button><span class="status" id="loginErr" role="alert"></span></form></div>
<script src="/settings.js"></script>
<script>

// ---- markdown: builds DOM nodes only (never innerHTML), links limited to http(s)/mailto ----
function inline(text) {
  const out = [];
  const re = /(`+)([\s\S]*?)\1|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*\s][^*]*)\*|_([^_\s][^_]*)_|~~([^~]+)~~|\[([^\]]+)\]\(([^)\s]+)\)|(https?:\/\/[^\s<)]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    if (m[1]) out.push(h("code", {}, m[2]));
    else if (m[3] || m[4]) out.push(h("strong", {}, ...inline(m[3] || m[4])));
    else if (m[5] || m[6]) out.push(h("em", {}, ...inline(m[5] || m[6])));
    else if (m[7]) out.push(h("del", {}, ...inline(m[7])));
    else if (m[8]) out.push(safeLink(m[9], inline(m[8])));
    else if (m[10]) out.push(safeLink(m[10], [m[10]]));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}
function safeLink(href, kids) {
  if (!/^(https?:|mailto:)/i.test(href)) return h("span", {}, ...kids);
  return h("a", { href, target: "_blank", rel: "noopener noreferrer" }, ...kids);
}
function codeBlock(code) {
  const pre = h("pre", { class: "code" }, code);
  const btn = h("button", { type: "button", onclick: () => { navigator.clipboard?.writeText(code); btn.textContent = "copied"; setTimeout(() => (btn.textContent = "copy"), 1200); } }, "copy");
  return h("div", { class: "codewrap" }, pre, btn);
}
function markdown(src) {
  const frag = document.createDocumentFragment();
  const lines = String(src).replace(/\r\n/g, "\n").split("\n");
  let i = 0, para = [];
  const flush = () => { if (para.length) { frag.append(h("p", {}, ...inline(para.join("\n")))); para = []; } };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = /^\s*(```|~~~)/.exec(l))) {
      flush();
      const fence = m[1], body = [];
      i++;
      while (i < lines.length && !lines[i].trimStart().startsWith(fence)) body.push(lines[i++]);
      i++; frag.append(codeBlock(body.join("\n"))); continue;
    }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { flush(); frag.append(h("h" + Math.min(m[1].length, 4), {}, ...inline(m[2]))); i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)) { flush(); frag.append(h("hr")); i++; continue; }
    if (/^\s*>/.test(l)) {
      flush(); const q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
      const bq = h("blockquote"); bq.append(markdown(q.join("\n"))); frag.append(bq); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      flush();
      const ordered = /^\s*\d/.test(l), list = h(ordered ? "ol" : "ul");
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        const item = [lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "")];
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item.push(lines[i++].trim());
        const li = h("li"); li.append(...inline(item.join("\n"))); list.append(li);
      }
      frag.append(list); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      flush();
      const cells = (s) => s.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const table = h("table"), head = h("tr");
      for (const c of cells(l)) head.append(h("th", {}, ...inline(c)));
      table.append(head); i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { const tr = h("tr"); for (const c of cells(lines[i++])) tr.append(h("td", {}, ...inline(c))); table.append(tr); }
      frag.append(table); continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l); i++;
  }
  flush();
  return frag;
}

// ---- transcript rendering ----
function textBlocks(content) {
  if (typeof content === "string") return content;
  return (content || []).filter((c) => c.type === "text").map((c) => c.text).join("");
}
function scroll(force) { const l = $("log"); if (force || l.scrollHeight - l.scrollTop - l.clientHeight < 200) l.scrollTop = l.scrollHeight; }
function addUser(content) {
  clearWelcome();
  const d = h("div", { class: "msg user" });
  if (typeof content === "string") d.append(content);
  else for (const c of content || []) {
    if (c.type === "text") d.append(c.text);
    else if (c.type === "image") d.append(h("img", { class: "att", src: `data:${c.mimeType};base64,${c.data}`, alt: "attachment" }));
  }
  $("log").append(d); scroll(true); return d;
}
function addAssistant(text) { clearWelcome(); const d = h("div", { class: "msg assistant md" }); d.append(markdown(text)); $("log").append(d); scroll(); return d; }
function setAssistant(d, text) { d.replaceChildren(markdown(text)); }
function addErr(text) { clearWelcome(); const d = h("div", { class: "msg err" }, text); $("log").append(d); scroll(); return d; }
function addTool(name, args, output, isError) {
  clearWelcome();
  const s = h("summary", {}, (isError ? "Failed · " : "Tool · ") + name);
  const pre = h("pre", {}, (args ? "args: " + JSON.stringify(args, null, 1) + "\n" : "") + (output ? "\n" + output : ""));
  const d = h("details", { class: "tool" }, s, pre);

}
// Link a delegate_task spawn result to the child session.
function linkChild(view, out) {
  const m = view.name === "delegate_task" && /spawned child (\d+)/.exec(out || "");
  if (m) view.s.append(" ", h("a", { onclick: (e) => { e.preventDefault(); openSession(m[1]); } }, "→ child " + m[1]));
}
function finishTool(view, m) {
  const out = textBlocks(m.content);
  view.pre.textContent += "\n" + out;
  if (m.isError) view.s.textContent = "Failed · " + view.name;
  linkChild(view, out);
}

// ---- usage ----
function showUsage(u) {
  if (!u?.models) { $("usage").textContent = ""; return; }
  let inT = 0, outT = 0, cost = 0;
  for (const v of Object.values(u.models)) { inT += v.input + (v.cacheRead || 0) + (v.cacheWrite || 0); outT += v.output; cost += v.cost?.total || 0; }
  $("usage").textContent = `${(inT / 1000).toFixed(1)}k in · ${(outT / 1000).toFixed(1)}k out${cost ? " · $" + cost.toFixed(4) : ""}`;
}

function renderSessions() {

async function openSession(id) {
  session = String(id);
  localStorage.setItem("luna.session", session);
  $("log").replaceChildren(); $("extras").replaceChildren();
  const s = await json(`/v1/sessions/${id}?limit=500`);
  $("title").textContent = sessionList.find(s => String(s.id) === String(id))?.title || "Conversation " + id;
  const cur = s.agent.model || defaultModel;
  if (cur) { const v = cur.provider + "/" + cur.modelId; if (![...$("model").options].some((o) => o.value === v)) $("model").append(h("option", { value: v }, cur.modelId)); $("model").value = v; }
  $("think").value = s.agent.thinkingLevel || "off";
  showUsage(s.usage);
  renderExtras(s);
  const pending = new Map();
  for (const e of [...s.entries].reverse()) {
    if (e.kind === "pi.reset") { addErr("— context reset —").className = "msg muted"; continue; }
    if (e.kind === "pi.compaction") { addErr("— earlier messages compacted —").className = "msg muted"; continue; }
    const m = (e.model || [])[0];
    if (!m) continue;
    if (m.role === "user") addUser(m.content);
    else if (m.role === "assistant") {
      const t = textBlocks(m.content);
      if (t) addAssistant(t);
      for (const c of m.content || []) if (c.type === "toolCall") pending.set(c.id, addTool(c.name, c.arguments));
      if (m.stopReason === "error" && m.errorMessage) addErr(m.errorMessage);
    } else if (m.role === "toolResult") {
      const v = pending.get(m.toolCallId);
      if (v) finishTool(v, m); else addTool(m.toolName || "tool", null, textBlocks(m.content), m.isError);
    }
  }

  scroll(true);
  loadSessions().catch(() => {});
}
async function newSession() {
  const { id } = await post("/v1/sessions", {});
  await openSession(id);
  return id;
}

$("attach").onclick = () => $("file").click();

document.addEventListener("paste", async (e) => { for (const it of e.clipboardData?.items || []) if (it.type.startsWith("image/")) { e.preventDefault(); await addAttachment(it.getAsFile()); } });
async function addAttachment(file) {
  if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) return addErr("only png, jpeg, gif and webp images can be attached");
  if (attachments.length >= 8) return addErr("at most 8 images per message");
  const blob = await shrink(file);
  const data = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
  attachments.push({ mimeType: blob.type, data, url: URL.createObjectURL(blob) });
  renderAtts();
}
// Downscale big photos to 2000px max so uploads stay small; GIFs pass through.
async function shrink(file) {
  if (file.type === "image/gif") return file;
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp || Math.max(bmp.width, bmp.height) <= 2000) return file;
  const k = 2000 / Math.max(bmp.width, bmp.height);
  const c = h("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob((b) => r(b || file), "image/jpeg", 0.88));
}
function renderAtts() {
  $("atts").replaceChildren(...attachments.map((a, i) => h("div", {}, h("img", { src: a.url, alt: "attachment" }), h("button", { type: "button", "aria-label": "Remove attached image " + (i + 1), onclick: () => { URL.revokeObjectURL(a.url); attachments.splice(i, 1); renderAtts(); } }, "×"))));
}

// ---- send + stream ----
function setBusy(b, label) { busy = b; $("send").disabled = b; $("stop").disabled = !b; $("status").textContent = label || "Ready"; }
$("stop").onclick = () => session && api(`/v1/sessions/${session}/abort`, { method: "POST" });

async function send(text, atts) {
  if (!session) await newSession();
  const content = atts.length ? [...(text ? [{ type: "text", text }] : []), ...atts.map((a) => ({ type: "image", data: a.data, mimeType: a.mimeType }))] : text;
  addUser(content);
  setBusy(true, "thinking…");
  let cur = null, curText = "";
  const tools = new Map();
  try {
    const r = await api(`/v1/sessions/${session}/messages?stream=1`, { method: "POST", headers: { accept: "text/event-stream" }, body: JSON.stringify({ content, whenBusy: "steer" }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", pendingRender = false;
    const render = () => { pendingRender = false; if (cur) { setAssistant(cur, curText); scroll(); } };
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(frame)?.[1];
        const data = frame.split("\n").filter((l) => l.startsWith("data: ")).map((l) => l.slice(6)).join("\n");
        if (!ev || !data) continue;
        let e; try { e = JSON.parse(data); } catch { continue; }
        if (ev === "message_start") { cur = null; curText = ""; }
        else if (ev === "message_update") {
          for (const c of e.changes || []) if (c.type === "text_delta") {
            curText += c.delta;
            if (!cur) cur = addAssistant("");
            if (!pendingRender) { pendingRender = true; requestAnimationFrame(render); }
            setBusy(true, "writing…");
          } else if (c.type === "thinking_delta") setBusy(true, "thinking…");
        } else if (ev === "message_end") { render(); cur = null; curText = ""; }
        else if (ev === "tool_execution_start") {
          tools.set(e.toolCallId, addTool(e.toolName, e.args)); setBusy(true, e.toolName === "ask_user_question" ? "waiting for your answer…" : "running " + e.toolName + "…");
          if (EXTRA_TOOLS.test(e.toolName)) loadExtras(e.toolName === "ask_user_question" ? 3 : 0);
        }
        else if (ev === "tool_execution_update" && e.output) {
          const v = tools.get(e.toolCallId);
          if (v && "set" in e.output) v.pre.textContent = e.output.set;
          else if (v && e.output.append) v.pre.textContent += e.output.append;
        } else if (ev === "tool_execution_end") {
          const v = tools.get(e.toolCallId), m = e.entry?.model?.[0];
          if (v && m) finishTool(v, m);
          if (v && EXTRA_TOOLS.test(v.name)) loadExtras();
          setBusy(true, "thinking…");
        } else if (ev === "usage_changed" && e.usage) showUsage(e.usage);
        else if (ev === "done") {
          render();
          if (e.status !== "done") addErr(e.status + (e.reason ? ": " + e.reason : "") + (e.detail ? "\n" + (typeof e.detail === "string" ? e.detail : JSON.stringify(e.detail)) : ""));
          else if (!$("log").lastElementChild?.classList.contains("assistant") && e.answer) addAssistant(e.answer);
        }
      }
    }
  } catch (err) {
    if (err.message !== "unauthorized") addErr(String(err.message || err));
  } finally {
    setBusy(false);
    loadSessions().catch(() => {});
    json(`/v1/sessions/${session}?limit=1`).then((s) => { showUsage(s.usage); renderExtras(s); }).catch(() => {});
  }
}

const input = $("input");
const grow = () => { input.style.height = "auto"; input.style.height = Math.max(input.scrollHeight + 2, 38) + "px"; };
input.addEventListener("input", grow);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !matchMedia(MOBILE).matches) { e.preventDefault(); $("form").requestSubmit(); } });

  e.preventDefault();
  const t = input.value.trim();
  if ((!t && !attachments.length) || busy) return;

  input.value = ""; grow();

// ---- todos, open questions, goal (ported plugins) ----
const EXTRA_TOOLS = /^(todo|ask_user_question|create_goal|update_goal|set_goal_tasks|update_goal_task)$/;
let answering = new Set();
async function loadExtras(retries = 0) {
  const sid = session;
  const s = await json(`/v1/sessions/${sid}?limit=1`).catch(() => null);
  if (!s || sid !== session) return;
  renderExtras(s);
  if (retries && !s.questions.length) setTimeout(() => loadExtras(retries - 1), 500);
}
function renderExtras(s) {
  const box = $("extras");
  // Keep a questionnaire the user is filling in.
  const keep = [...box.querySelectorAll("[data-ask]")].filter((f) => s.questions.some((q) => q.callId === f.dataset.ask));
  box.replaceChildren();
  if (s.goal) box.append(goalCard(s.goal));
  const todos = s.todos || [];
  if (todos.length) {
    const done = todos.filter((t) => t.status === "completed").length;
    const mark = { pending: "○", in_progress: "◐", completed: "✓" };
    box.append(h("details", { class: "card todo", open: "" }, h("summary", { class: "muted" }, `Todos ${done}/${todos.length}`),
      ...todos.map((t) => h("div", { class: t.status === "completed" ? "done" : "" }, `${mark[t.status] || "·"} #${t.id} ${t.subject}${t.status === "in_progress" && t.activeForm ? " — " + t.activeForm : ""}${t.blockedBy?.length ? " · Blocked by " + t.blockedBy.map((i) => "#" + i).join(",") : ""}`))));
  }
  for (const q of s.questions || []) box.append(keep.find((f) => f.dataset.ask === q.callId) || askForm(q));
}
function goalCard(g) {
  const done = g.tasks.filter((t) => t.status !== "pending").length;
  const act = (action) => async () => { try { await post(`/v1/sessions/${session}/goal`, { action }, "PATCH"); loadExtras(); } catch (e) { addErr(e.message); } };
  const open = g.status !== "complete";
  return h("div", { class: "card grid" },
    h("div", { class: "row" }, h("b", {}, "Goal " + g.id), h("span", { class: "pill " + (g.status === "complete" ? "ok" : g.status === "active" ? "running" : "") }, g.status),
      h("span", { class: "grow muted" }, `runs ${g.runs}/${g.maxRuns}${g.tasks.length ? ` · tasks ${done}/${g.tasks.length}` : ""}${g.tokenBudget ? ` · ${g.tokensUsed}/${g.tokenBudget} tok` : ""}`),
      open && g.status === "active" ? h("button", { onclick: act("pause") }, "Pause") : null,
      open && g.status !== "active" ? h("button", { onclick: act("resume") }, "Resume") : null,

  else $("menu").offsetParent ? $("menu").focus() : $("more").focus();
}
function toast(body, text) { const t = h("div", { class: "muted" }, text); body.prepend(t); setTimeout(() => t.remove(), 2500); }
$("pclose").onclick = closePanel;
$("panel").onclick = (e) => { if (e.target === $("panel")) closePanel(); };
for (const b of document.querySelectorAll("[data-panel]")) b.onclick = () => openPanel(b.dataset.panel);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (currentPanel) closePanel(); else if ($("side").classList.contains("open")) setDrawer(false); }
  if (e.key !== "Tab") return;
  const root = $("login").style.display === "flex" ? $("login") : currentPanel ? $("panel") : matchMedia(MOBILE).matches && $("side").classList.contains("open") ? $("side") : null;
  if (!root) return;
  const items = [...root.querySelectorAll('button:not(:disabled),input,textarea,select,a[href],[tabindex="0"]')].filter(el => el.offsetParent !== null && !el.disabled);
  const first = items[0], last = items.at(-1);
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
});

async function boot() {
  try {
    const hl = await (await fetch("/health")).json();
    if (hl.auth && !token) return showLogin();
    await loadModels();
    await loadSessions();
    if (session) await openSession(session).catch(() => { session = null; localStorage.removeItem("luna.session"); $("title").textContent = "New conversation"; });
    showWelcome();
    if (!busy) $("status").textContent = "Ready";
  } catch (e) { if (e.message !== "unauthorized") $("status").textContent = String(e.message || e); }
}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("/sw.js").catch(() => {});
setDrawer(false);
showWelcome();
boot();
</script>
</body>

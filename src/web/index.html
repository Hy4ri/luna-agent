<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f11">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/cron.css">
<link rel="stylesheet" href="/analytics.css">
<link rel="stylesheet" href="/settings.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Luna</title>
<script type="module" src="/js/main.js"></script>
</head>
<body>
<aside id="side" aria-label="Workspace">
  <header class="side-head"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A9 9 0 0 1 11 3.5 9 9 0 1 0 20.5 13Z"/></svg><h1>Luna</h1></div><button id="side-close" class="icon-button" aria-label="Close navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
  <div class="side-actions">
    <button id="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New conversation</span></button>
    <select id="project" aria-label="Project for new conversations"><option value="">No project</option></select>
  </div>
  <section class="history" aria-label="Conversation history">
    <div class="history-head"><input id="search" type="search" placeholder="Search conversations" aria-label="Find a conversation" autocomplete="off"><select id="history-view" aria-label="Conversation view"><option value="active">Active</option><option value="archived">Archived</option></select></div>
    <div id="sessions"></div>
  </section>
  <nav id="nav" aria-label="Workspace tools">
    <div class="eyebrow">Workspace</div>
    <button data-panel="agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M14 6h4v8M6 10v8h8"/></svg>Subagents</button>
    <button data-panel="analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16M8 16v-4m5 4V8m5 8V5"/></svg>Analytics</button>
    <button data-panel="cron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Cron <span id="cron-unread" class="pill" hidden aria-label="Unread cron reports"></span></button>
    <button data-panel="memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5c3-2 5-2 8 0 3-2 5-2 8 0v15c-3-2-5-2-8 0-3-2-5-2-8 0ZM12 5v15"/></svg>Memory</button>
    <button data-panel="skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>Skills</button>
    <button data-panel="providers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>Model providers</button>
    <button data-panel="mcp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v5M16 3v5M6 8h12v3a6 6 0 0 1-12 0ZM12 17v4"/></svg>MCP servers</button>
    <button data-panel="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>Projects</button>
    <button data-panel="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>Board</button>
    <div class="nav-foot"><button data-panel="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg>Settings</button></div>
  </nav>
</aside>
<button id="shade" aria-label="Close navigation" tabindex="-1"></button>
<main id="main">
  <header id="top">
    <button id="menu" class="icon-button" aria-label="Open navigation" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="heading"><span id="title">New conversation</span></div>
    <button id="stop" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg><span>Stop</span></button>
    <button id="more" class="icon-button" title="Conversation settings" aria-label="Conversation settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </header>
  <div id="log" role="region" aria-label="Conversation" tabindex="0"></div>
  <button id="jump" class="icon-button" aria-label="Scroll to latest message" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg></button>
  <div id="extras" aria-label="Tasks and questions"></div>
  <div id="compose">
    <div id="composer">
      <div id="atts" aria-label="Attached images"></div>
      <div id="busyFeedback" class="muted" role="status" aria-live="polite" hidden></div>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Message Luna…" aria-label="Message Luna"></textarea>
        <div class="compose-bar">
          <button type="button" id="attach" class="icon-button" title="Attach images or audio" aria-label="Attach images or audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 13 7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L12 3"/></svg></button>
          <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp,audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/ogg,audio/webm,audio/mp4,audio/flac" multiple hidden>
          <div id="controls">
            <button id="model" type="button" popovertarget="model-picker" aria-label="Model" aria-expanded="false">Choose model</button>
            <select id="think" aria-label="Thinking level" title="Thinking level"></select>
          </div>
          <span class="compose-hint">Enter to send · Shift+Enter for a new line</span>
          <button id="send" type="submit" class="primary" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg><span>Send</span></button>
        </div>
      </form>
    </div>
    <div id="statusbar"><span class="status" id="status" role="status"></span><div id="context-bar" hidden><div id="context-meter" role="progressbar" aria-label="Estimated context usage" aria-valuemin="0" aria-valuemax="100"><div id="context-fill"></div></div><span id="context-text"></span></div><span id="usage" aria-label="Token usage"></span></div>
  </div>
  <div id="model-picker" popover aria-label="Choose model"></div>
</main>
<main id="cron-screen" class="page" hidden aria-label="Cron"></main>
<main id="analytics-screen" class="page" hidden aria-label="Analytics"></main>
<main id="settings-screen" class="page" hidden aria-label="Settings"></main>
<div id="panel"><div role="dialog" aria-modal="true" aria-labelledby="ptitle" aria-describedby="pdesc" tabindex="-1"><header><div class="heading"><b id="ptitle"></b><p id="pdesc"></p></div><button id="pclose" class="icon-button" aria-label="Close panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header><div id="pbody"></div></div></div>
<div id="login" role="dialog" aria-modal="true" aria-labelledby="loginTitle"><form id="loginForm"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A9 9 0 0 1 11 3.5 9 9 0 1 0 20.5 13Z"/></svg><h2 id="loginTitle">Connect to Luna</h2></div><p>Enter your server token to open your workspace.</p><label class="grid">Server token<input id="token" type="password" autocomplete="current-password" placeholder="LUNA_TOKEN" required></label><button class="primary">Connect</button><span class="status" id="loginErr" role="alert"></span></form></div>
</body>
</html>

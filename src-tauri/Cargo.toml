[package]
name = "luna-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop shell for the luna-pi web UI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Linux: the StatusNotifierItem backend delivers tray clicks; the appindicator backend never does.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
tauri-plugin-single-instance = "2"

[features]
# Set by `cargo tauri build`; also lets a plain `cargo build --features custom-protocol` embed dist/web.
custom-protocol = ["tauri/custom-protocol"]

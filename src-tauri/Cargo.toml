[package]
name = "luna-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop shell for the luna-pi web UI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Set by `cargo tauri build`; also lets a plain `cargo build --features custom-protocol` embed dist/web.
custom-protocol = ["tauri/custom-protocol"]
